<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dein Name – Marketing & Social Media</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#fbfbfa;--card:#ffffff;--ink:#14213d;--muted:#5b6478;--line:#e2e4ea;--accent:#ff7a2f;--accent-ink:#14213d;--accent-text:#b83a0a;--stein:#14213d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#141516;--card:#202223;--ink:#eef0ec;--muted:#9da3a0;--line:#313436;--accent:#ffb24a;--accent-ink:#141516;--accent-text:#ffb24a;--stein:#e4dfd3}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 60px}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;line-height:1.08;margin:0}
.profil{display:flex;gap:28px;align-items:center;flex-wrap:wrap}
.avatar{width:120px;height:120px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--bg),0 0 0 8px var(--stein);color:var(--accent-ink);display:grid;place-items:center;font:700 48px 'Bricolage Grotesque',system-ui,sans-serif;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:240px}
.info h1{font-size:2.8rem}
.rolle{color:var(--muted);margin:4px 0 10px}
.bio{margin:0 0 14px;max-width:52ch}
.zahlen{display:flex;gap:22px;margin:0 0 16px;padding:0;list-style:none}
.zahlen b{display:block;font:700 1.7rem 'Bricolage Grotesque',system-ui,sans-serif}
.zahlen span{font-size:.85rem;color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:10px 20px;border-radius:999px;font-weight:600;text-decoration:none;border:0;cursor:pointer;font-size:1rem}
.btn:focus-visible,.tab:focus-visible,.kachel:focus-visible,.hl:focus-visible,.zu:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.highlights{display:flex;gap:18px;overflow-x:auto;padding:26px 2px 10px}
.hl{background:none;border:0;cursor:pointer;text-align:center;color:var(--ink);font:500 .85rem Figtree,sans-serif;flex:none;width:72px}
.hl i{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 6px;border-radius:50%;border:3px solid var(--accent);font-style:normal;font-size:1.5rem;background:var(--card)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px;margin-top:14px}
.tab{background:var(--card);border:1px solid var(--line);color:var(--ink);padding:7px 16px;border-radius:999px;cursor:pointer;font:500 .95rem Figtree,sans-serif}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.kachel{aspect-ratio:1;border-radius:22px;border:0;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;color:#14213d;position:relative;overflow:hidden;background-size:cover;background-position:center}
.kachel[data-farbe="kobalt"]{background-color:#3b5bff;color:#fff}.kachel[data-farbe="salbei"]{background-color:#8fd1a8}
.kachel[data-farbe="gelb"]{background-color:#ffd23f}.kachel[data-farbe="orange"]{background-color:#ff7a2f}
.kachel strong{font:700 1.5rem 'Bricolage Grotesque',system-ui,sans-serif;line-height:1.1}
.kachel small{opacity:.8;margin-top:4px}
.kachel.hatbild strong,.kachel.hatbild small{background:rgba(255,255,255,.88);color:#141516;padding:2px 8px;border-radius:6px;width:fit-content}
.suche{display:inline-block;border:1px solid var(--accent);color:var(--accent-text);border-radius:16px;padding:6px 14px;font-size:.9rem;margin:0 0 14px}
.knoepfe,.linkliste{display:flex;gap:10px;flex-wrap:wrap}
.linkliste{margin-top:20px}
.btn.zweit{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.zweit:hover{border-color:var(--accent-text)}
.kurz{font-weight:600;font-size:.95rem;margin-top:8px}
.kachel.hatbild .kurz{background:rgba(255,255,255,.88);color:#141516;padding:2px 8px;border-radius:6px;width:fit-content}
.ref{margin:20px 0 0;padding:14px 18px;border-left:3px solid var(--accent);background:var(--bg);border-radius:0 12px 12px 0}
.ref p{font:500 1.25rem/1.3 'Bricolage Grotesque',system-ui,sans-serif}
.ref cite{display:block;margin-top:6px;font-size:.85rem;color:var(--muted);font-style:normal}
.aussage{font:700 clamp(2.8rem,9vw,5.4rem)/.98 'Bricolage Grotesque',system-ui,sans-serif;margin:6px 0 38px;max-width:15ch}
.nr{font:500 .82rem Figtree,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:52px 0 14px}
.band{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:18px 0}
.zahl b{display:block;font:700 clamp(2.6rem,7vw,3.6rem)/1.05 'Bricolage Grotesque',system-ui,sans-serif;color:var(--accent-text)}
.zahl span{font-size:.9rem;color:var(--muted)}
.marquee{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0}
.track{display:flex;width:max-content;animation:lauf 36s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.track span{font:500 1.7rem 'Bricolage Grotesque',system-ui,sans-serif;white-space:nowrap}
.track span::after{content:"·";margin:0 22px;color:var(--accent-text)}
@keyframes lauf{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.track{animation:none;flex-wrap:wrap;width:auto;row-gap:6px}.track span[aria-hidden]{display:none}}
.galerie{margin:22px 0 0}
.rahmen{max-height:480px;overflow:auto;border-radius:12px;border:1px solid var(--line)}
.rahmen img{display:block;width:100%;height:auto;margin:0;border-radius:0}
.galerie figcaption{font-size:.85rem;color:var(--muted);margin-top:6px}
.bereich{margin-top:34px}
.bereichtitel{font:700 2.1rem/1.1 'Bricolage Grotesque',system-ui,sans-serif;margin:0}
.bereichtext{color:var(--muted);margin:6px 0 0;max-width:60ch}
.reels{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-top:8px}
.reel{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;font-size:.92rem;background:var(--bg)}
.reel:hover{border-color:var(--accent-text)}
.reel:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.rnr{flex:none;width:26px;height:26px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:.8rem;font-weight:600}
.rtxt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.reel small{color:var(--muted);flex:none}
.mehr{margin-top:10px}
.mehr summary{cursor:pointer;color:var(--accent-text);font-weight:600;margin-bottom:8px}
.kachel{transition:transform .35s ease,opacity .5s ease,box-shadow .25s ease}
.kachel:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 14px 30px rgba(0,0,0,.35)}
.kachel:active{transform:scale(.97)}
@media (prefers-reduced-motion:no-preference){.kachel.neu{opacity:0;transform:translateY(18px)}.kachel.neu.da{opacity:1;transform:none}.kachel.neu.da:hover{transform:translateY(-4px) rotate(-.4deg)}.kachel.neu.da:active{transform:scale(.97)}}
.hl i{transition:transform .2s ease,border-color .3s ease}
.hl:hover i{transform:scale(1.08)}
.hl.gesehen i{border-color:var(--line)}
#story{width:min(430px,100%);height:min(100dvh,860px);max-height:none;padding:0;border:0;border-radius:20px;overflow:hidden;background:var(--card)}
#story::backdrop{background:rgba(0,0,0,.88)}
@media (max-width:480px){#story{width:100%;height:100dvh;border-radius:0}}
.st{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:80px 28px 48px;color:#141516;overflow:auto}
.st h2{font:700 clamp(2.6rem,12vw,4rem)/1 'Bricolage Grotesque',system-ui,sans-serif;margin:0 0 18px}
.st p{font-size:1.2rem;line-height:1.45;max-width:32ch;margin:0}
.bars{position:absolute;top:16px;left:16px;right:16px;display:flex;gap:4px;z-index:2}
.bar{flex:1;height:3px;border-radius:2px;background:rgba(20,21,22,.25);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#141516}
.bar.fertig i{width:100%}
@media (prefers-reduced-motion:no-preference){.bar.aktiv i{animation:fuell 5s linear forwards}}
@media (prefers-reduced-motion:reduce){.bar.aktiv i{width:100%}}
@keyframes fuell{to{width:100%}}
.tap{position:absolute;top:0;bottom:0;width:42%;z-index:1;background:none;border:0;cursor:pointer}
.tap.l{left:0}.tap.r{right:0}
.stclose{position:absolute;top:30px;right:14px;z-index:3;width:44px;height:44px;border:0;border-radius:50%;background:rgba(20,21,22,.12);color:#141516;font-size:1.1rem;cursor:pointer}
.tap:focus-visible,.stclose:focus-visible{outline:3px solid #141516;outline-offset:-3px}
.hl i{border:3px solid transparent;background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(45deg,#ffd23f,#ff5a3c,#ff5fa2,#7a4dff) border-box}
.hl.gesehen i{background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(var(--line),var(--line)) border-box}
.raster{grid-template-columns:repeat(4,1fr);grid-auto-rows:170px;grid-auto-flow:dense}
.kachel{aspect-ratio:auto}
.kachel.gross{grid-column:span 2;grid-row:span 2}
.kzahl{font:700 2.1rem/1 'Bricolage Grotesque',system-ui,sans-serif;margin-bottom:auto}
.kachel.gross .kzahl{font-size:3.6rem}
.kachel strong{font-size:1.15rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kachel.gross strong{font-size:1.8rem}
.kachel.hatbild .kzahl{background:rgba(255,255,255,.88);color:#141516;padding:0 8px;border-radius:6px;width:fit-content}
@media (max-width:620px){.raster{grid-template-columns:repeat(2,1fr);grid-auto-rows:150px}.kzahl{font-size:1.6rem}.kachel.gross .kzahl{font-size:2.8rem}}
.balken{display:flex;gap:4px;margin:8px 46px 18px 0}
.balken i{flex:1;height:3px;border-radius:2px;background:var(--line)}
.balken i.an{background:var(--accent)}
.buehne{min-height:340px;touch-action:pan-y}
.folie{display:flex;flex-direction:column;gap:12px;min-height:340px}
.fkopf{font:500 .82rem Figtree,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);margin:0}
.ftext{font:500 1.5rem/1.3 'Bricolage Grotesque',system-ui,sans-serif;margin:0;max-width:34ch}
.folie.gross .ftext{font-size:2.1rem}
.fzahl{font:700 clamp(3.6rem,15vw,6.4rem)/1 'Bricolage Grotesque',system-ui,sans-serif;margin:0}
.deckblatt{justify-content:flex-end;padding:22px;border-radius:16px;color:#141516}
.deckblatt .fkopf{color:inherit}
.deckblatt h2{font-size:2.1rem;margin:0}
.deckblatt[data-farbe="kobalt"]{background:#3b5bff;color:#fff}.deckblatt[data-farbe="salbei"]{background:#8fd1a8}
.deckblatt[data-farbe="gelb"]{background:#ffd23f}.deckblatt[data-farbe="orange"]{background:#ff7a2f}
.fnav{display:flex;justify-content:space-between;margin-top:18px}
h1,h2,h3,.kzahl,.fzahl,.zahl b,.bereichtitel{letter-spacing:-.02em}
.kachel.mitbild::before{content:"";position:absolute;inset:-14px;background:var(--bg-img) center/cover no-repeat;filter:blur(3px) saturate(1.1);opacity:.28;pointer-events:none}
.kachel.mitbild>.kzahl,.kachel.mitbild>strong,.kachel.mitbild>small{position:relative;z-index:1}
.leer{color:var(--muted);padding:30px 0}
dialog{width:min(640px,calc(100% - 24px));max-height:90vh;border:0;border-radius:18px;padding:0;background:var(--card);color:var(--ink);overflow:auto}
dialog::backdrop{background:rgba(10,18,28,.6)}
.inhalt{padding:26px 24px 30px}
.zu{float:right;background:var(--bg);color:var(--ink);border:0;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:1.1rem}
.kat{display:inline-block;color:var(--accent-text);font-weight:600;margin-bottom:6px}
.inhalt h2{font-size:2.3rem;margin-bottom:14px}
.inhalt h3{font:600 .95rem Figtree,sans-serif;margin:18px 0 4px;color:var(--accent-text)}
.inhalt p{margin:0;max-width:62ch}
.inhalt img{width:100%;border-radius:12px;margin-bottom:14px}
.kontakt{margin-top:44px;padding:26px;background:var(--card);border:1px solid var(--line);border-radius:18px}
.kontakt p{margin:6px 0 14px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">

<header class="profil">
  <div class="avatar" id="avatar" aria-hidden="true"></div>
  <div class="info">
    <h1 id="name"></h1>
    <p class="rolle" id="rolle"></p>
    <p class="bio" id="bio"></p>
    <p class="suche" id="suche"></p>
    <ul class="zahlen" id="zahlen"></ul>
    <div class="knoepfe" id="knoepfe"><a class="btn" id="mail">Kontakt aufnehmen</a></div>
  </div>
</header>

<nav class="highlights" id="highlights" aria-label="Über mich"></nav>
<p class="nr">(01) Kennzahlen</p>
<div class="band" id="band"></div>
<p class="nr">(02) Projekte</p>
<main id="projekte"></main>
<p class="nr">(03) Tools</p>
<div class="marquee" aria-label="Tools"><div class="track" id="track"></div></div>

<section class="kontakt" id="kontakt">
  <p class="nr" style="margin-top:0">(04) Kontakt</p>
  <h2 id="kontaktTitel"></h2>
  <p id="kontaktText"></p>
  <a class="btn" id="mail2">E-Mail schreiben</a>
</section>

</div>

<dialog id="dlg" aria-label="Projektdetails"><div class="inhalt" id="dlgInhalt"></div></dialog>
<dialog id="story" aria-label="Story"></dialog>

<script>
/* =====================================================================
   HIER PFLEGST DU DEINE INHALTE.
   Ergänzen: einen Eintrag kopieren, Text ändern.
   Entfernen: den ganzen Eintrag zwischen { und }, löschen.
   Am Design musst du nichts anfassen.
   ===================================================================== */

const PROFIL = {
  name: "Dein Name",
  initialen: "DN",
  bild: "",                       // optional: Bild-URL oder leer lassen
  rolle: "Marketing, Social Media & Content",
  bio: "Strukturierte Detailhandelsfachfrau mit fundierter Berufserfahrung in Kundenberatung, Kundenbegleitung und Prozessorganisation (SBB). Leidenschaftliche Social Media Content Creatorin mit nachgewiesener Erfahrung im Markenaufbau (Ehrenamt). Ich verbinde operative Exzellenz mit kreativem Gespür und hoher Affinität für digitale Trends.",
  zahlen: [                       // beliebig viele Kennzahlen
    { wert: "Teilzeit", label: "Pensum" },
    { wert: "DE · PT · EN · FR", label: "Sprachen" }
  ],
  email: "g.antoniodombaxe@gmail.com",
  suche: "Ich suche: Teilzeitstelle als Marketing Assistant, Junior Marketing Managerin, Junior Creative Strategist oder im Bereich Social Media & Content · Eintritt nach Vereinbarung",
  /* Links oben unter dem Profil. Zeile löschen = Button verschwindet. */
  links: [
    { label: "LinkedIn", url: "https://www.linkedin.com/in/dein-profil" },
    { label: "Instagram", url: "https://www.instagram.com/dein-profil" },
    { label: "Lebenslauf (PDF)", url: "https://example.com/lebenslauf.pdf" }
  ],
  kontaktTitel: "Lass uns reden",
  kontaktText: "Ich freue mich über Anfragen für Teilzeitstellen und Projekte im Bereich Social Media und Content."
};

/* Zahlenstreifen: nur Werte, die du belegen kannst. Zeile löschen = Zahl verschwindet.
   Steht in "wert" eine Zahl, zählt sie beim Scrollen hoch. */
const KENNZAHLEN = [
  { wert: "ca. +40 %", label: "Engagement-Rate im Content-Creator-Projekt" },
  { wert: "5", label: "Social-Media-Kanäle betreut" },
  { wert: "3", label: "Plattformen mit Video-Ads" },
  { wert: "X", label: "Creator im UGC-Pilotprojekt (Zahl ergänzen)" }
];

/* Tools-Leiste */
const TOOLS = ["Adobe Premiere Pro", "InDesign", "Lightroom", "Canva", "CapCut", "InShot", "Meta Business Suite", "Google Analytics", "Drupal", "WordPress", "Ticketing-System", "MS Office"];

/* Die Kreise unter dem Profil. Symbol ist ein Emoji. */
const HIGHLIGHTS = [
  { symbol: "👋", titel: "Über mich", text: "Detailhandelsfachfrau EFZ mit Erfahrung in Kundenberatung, Live-Marketing und Social Media. Ich bringe Kommunikationsstärke, Zuverlässigkeit und ein offenes Auftreten mit und begeistere mich für Street Culture, Sneaker und Streetwear." },
  { symbol: "🛠️", titel: "Tools", text: "Adobe Premiere Pro, InDesign, Lightroom, Canva, CapCut, InShot, Meta Business Suite, Google Analytics (Basics), Drupal, WordPress, Ticketing-System, MS Office (Excel, PowerPoint, Word)." },
  { symbol: "🎓", titel: "Ausbildung", text: "Teilzeitstudium Marketingmanagerin HF (2026–2029). Davor Detailhandelsfachfrau Öffentlicher Verkehr EFZ (2022–2025)." },

    umsetzung: "Content Creation für Instagram, Branding und Design von Event-Grafiken, Community Management sowie Eventbegleitung mit Foto und Video.",

  },
  {
    titel: "Social-Media-Marketing: Community für Jugendliche aufgebaut",
    weichbild: IMG_EHRENAMT,
    zahl: "500",  /* grosse Zahl oder Wort auf der Kachel */
    bereich: "ehrenamt",
    kategorie: "Ehrenamt",
    farbe: "orange",
    bild: "",
    kurz: "500 Follower, über 1’600 Aufrufe in 30 Tagen",
    links: [],
    ausgangslage: "Ehrenamtliche Social-Media-Betreuung für eine Jugendgruppe (2023–2025) mit der Zielgruppe 16 bis 19 Jahre.",
    strategie: "Community Building und Pflege der Markenidentität mit jugendgerechter Ansprache.",
    umsetzung: "Content für Instagram (Bilder, Reels, Stories), Promotion von Events, digitale Flyer, mobile Videografie und Schnitt sowie Performance-Monitoring im Professional Dashboard.",
    ergebnis: "Über 1’600 Aufrufe in 30 Tagen, Wachstum auf 500 Follower und interaktive Formate, die die Bindung stärken.",
    learnings: "Platzhalter: Was funktioniert bei 16- bis 19-Jährigen am besten?"
  }
];

/* ===================== Ab hier nichts ändern ===================== */
const $ = id => document.getElementById(id);
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt !== undefined) e.textContent = txt; return e; };

document.title = PROFIL.name + " – " + PROFIL.rolle;
$("name").textContent = PROFIL.name;
$("rolle").textContent = PROFIL.rolle;
$("bio").textContent = PROFIL.bio;
if (PROFIL.bild) { const i = el("img"); i.src = PROFIL.bild; i.alt = ""; $("avatar").appendChild(i); } else { $("avatar").textContent = PROFIL.initialen; }
PROFIL.zahlen.forEach(z => { const li = el("li"); li.append(el("b", "", z.wert), el("span", "", z.label)); $("zahlen").appendChild(li); });
$("mail").href = $("mail2").href = "mailto:" + PROFIL.email;
$("suche").textContent = PROFIL.suche;
function linkBtn(l, zweit) {
  if (!/^https?:\/\//i.test(l.url)) return null;   /* nur http(s)-Links */
  const a = el("a", "btn" + (zweit ? " zweit" : ""), l.label);
  a.href = l.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  return a;
}
(PROFIL.links || []).forEach(l => { const b = linkBtn(l, true); if (b) $("knoepfe").appendChild(b); });

function countUp(node, text) {
  const m = text.match(/\d+/);
  if (!m || window.matchMedia("(prefers-reduced-motion: reduce)").matches || !("IntersectionObserver" in window)) return;
  const ziel = +m[0], pre = text.slice(0, m.index), post = text.slice(m.index + m[0].length);
  const io = new IntersectionObserver(es => {
    if (!es[0].isIntersecting) return;
    io.disconnect();
    const t0 = performance.now();
    (function schritt(t) { const p = Math.min(1, (t - t0) / 900); node.textContent = pre + Math.round(ziel * p) + post; if (p < 1) requestAnimationFrame(schritt); })(t0);
  });
  io.observe(node);
}
KENNZAHLEN.forEach(z => { const d = el("div", "zahl"); const b = el("b", "", z.wert); d.append(b, el("span", "", z.label)); $("band").appendChild(d); countUp(b, z.wert); });
[0, 1].forEach(i => TOOLS.forEach(t => { const sp = el("span", "", t); if (i) sp.setAttribute("aria-hidden", "true"); $("track").appendChild(sp); }));
$("kontaktTitel").textContent = PROFIL.kontaktTitel;
$("kontaktText").textContent = PROFIL.kontaktText;

const dlg = $("dlg"), inhalt = $("dlgInhalt");
function oeffne(build) {
  inhalt.replaceChildren();
  const zu = el("button", "zu", "✕"); zu.setAttribute("aria-label", "Schliessen"); zu.onclick = () => dlg.close();
  inhalt.appendChild(zu); build(inhalt); dlg.showModal();
}
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

const story = $("story"), gesehen = new Set(), hlButtons = [];
const STORYFARBEN = ["#a8d5ba", "#f2b8a2", "#8fa4f0", "#e4dfd3"];
const wenigBewegung = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let storyIdx = 0, storyTimer = null;
function naechsteStory() { if (storyIdx < HIGHLIGHTS.length - 1) zeigeStory(storyIdx + 1); else story.close(); }
function zeigeStory(i) {
  storyIdx = i; clearTimeout(storyTimer);
  const h = HIGHLIGHTS[i];
  story.replaceChildren();
  const bars = el("div", "bars");
  HIGHLIGHTS.forEach((_, j) => { const b = el("div", "bar" + (j < i ? " fertig" : j === i ? " aktiv" : "")); b.appendChild(el("i")); bars.appendChild(b); });
  const slide = el("div", "st"); slide.style.background = STORYFARBEN[i % STORYFARBEN.length];
  slide.append(bars, el("h2", "", h.symbol + " " + h.titel), el("p", "", h.text));
  const l = el("button", "tap l"); l.setAttribute("aria-label", "Zurück"); l.onclick = () => zeigeStory(Math.max(0, i - 1));
  const rr = el("button", "tap r"); rr.setAttribute("aria-label", "Weiter"); rr.onclick = naechsteStory;
  const x = el("button", "stclose", "✕"); x.setAttribute("aria-label", "Schliessen"); x.onclick = () => story.close();
  slide.append(l, rr, x); story.appendChild(slide);
  gesehen.add(i); hlButtons.forEach((b, j) => b.classList.toggle("gesehen", gesehen.has(j)));
  if (!story.open) story.showModal();
  if (!wenigBewegung) storyTimer = setTimeout(naechsteStory, 5000);
}
story.addEventListener("close", () => clearTimeout(storyTimer));
story.addEventListener("click", e => { if (e.target === story) story.close(); });
HIGHLIGHTS.forEach((h, idx) => {
  const b = el("button", "hl"); const i = el("i", "", h.symbol); b.append(i, document.createTextNode(h.titel));
  b.onclick = () => zeigeStory(idx);
  hlButtons.push(b); $("highlights").appendChild(b);
});

const felder = [["ausgangslage", "Ausgangslage"], ["strategie", "Strategie"], ["umsetzung", "Umsetzung"], ["ergebnis", "Ergebnis"], ["learnings", "Learnings"]];

const beo = "IntersectionObserver" in window ? new IntersectionObserver((es, o) => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add("da"); o.unobserve(e.target); } }), { threshold: .15 }) : null;
function beobachter(k) { if (beo) beo.observe(k); else k.classList.add("da"); }

function projektStory(p) {
  oeffne(c => {
    const folien = [];
    const txt = t => el("p", "ftext", t);
    const folie = (kopf, ...teile) => { const d = el("div", "folie"); if (kopf) d.appendChild(el("p", "fkopf", kopf)); teile.forEach(t => d.appendChild(t)); folien.push(d); return d; };
    const f0 = folie(p.kategorie, el("h2", "", p.titel), el("p", "fzahl", p.zahl || ""));
    f0.classList.add("deckblatt"); f0.dataset.farbe = p.farbe || "gelb";
    if (p.kurz) f0.appendChild(el("p", "", p.kurz));
    if (p.ausgangslage) folie("Ausgangslage", txt(p.ausgangslage));
    const so = [p.strategie, p.umsetzung].filter(Boolean);
    if (so.length) folie("Strategie und Umsetzung", ...so.map(txt));
    if (p.ergebnis) {
      const fe = folie("Ergebnis", txt(p.ergebnis)); fe.classList.add("gross");
      if (p.referenz) { const q = el("blockquote", "ref"); q.style.margin = "14px 0 0"; q.append(el("p", "", p.referenz.text), el("cite", "", p.referenz.von)); fe.appendChild(q); }
    }
    const belege = [];
    if (p.reels && p.reels.length) {
      const box = el("div", "reels"), rest = el("div", "reels");
      p.reels.forEach((rv, i) => {
        if (!/^https?:\/\//i.test(rv.url)) return;
        const a = el("a", "reel"); a.href = rv.url; a.target = "_blank"; a.rel = "noopener noreferrer";
        a.append(el("span", "rnr", String(i + 1)), el("span", "rtxt", rv.titel || "Video " + (i + 1)));
        if (rv.zahl) a.appendChild(el("small", "", rv.zahl));
        (i < 6 ? box : rest).appendChild(a);
      });
      belege.push(el("p", "fkopf", "Videos (" + p.reels.length + ")"), box);
      if (rest.children.length) { const d = el("details", "mehr"); d.append(el("summary", "", "Weitere " + rest.children.length + " Videos anzeigen"), rest); belege.push(d); }
    }
    if (p.galerie) p.galerie.forEach(g => { const f = el("figure", "galerie"); f.style.margin = "10px 0 0"; const rm = el("div", "rahmen"); const im = el("img"); im.src = g.src; im.alt = g.alt || ""; rm.appendChild(im); f.appendChild(rm); if (g.text) f.appendChild(el("figcaption", "", g.text)); belege.push(f); });
    if (p.links && p.links.length) { const box = el("div", "linkliste"); p.links.forEach(l => { const b = linkBtn(l, false); if (b) box.appendChild(b); }); belege.push(box); }
    if (belege.length) folie("Belege", ...belege);
    if (p.learnings) folie("Learnings", txt(p.learnings));

    const balken = el("div", "balken"); folien.forEach(() => balken.appendChild(el("i")));
    const buehne = el("div", "buehne");
    const zurueck = el("button", "btn zweit", "Zurück"), weiter = el("button", "btn", "Weiter");
    const nav = el("div", "fnav"); nav.append(zurueck, weiter);
    let n = 0;
    const zeige = () => {
      buehne.replaceChildren(folien[n]);
      [...balken.children].forEach((bl, i) => { bl.className = i <= n ? "an" : ""; });
      zurueck.style.visibility = n === 0 ? "hidden" : "visible";
      weiter.style.visibility = n === folien.length - 1 ? "hidden" : "visible";
    };
    const gehe = d => { const m = n + d; if (m >= 0 && m < folien.length) { n = m; zeige(); } };
    zurueck.onclick = () => gehe(-1); weiter.onclick = () => gehe(1);
    let x0 = null;
    buehne.addEventListener("pointerdown", e => { x0 = e.clientX; });
    buehne.addEventListener("pointerup", e => { if (x0 === null) return; const dx = e.clientX - x0; x0 = null; if (dx < -50) gehe(1); else if (dx > 50) gehe(-1); });
    dlg.onkeydown = e => { if (e.key === "ArrowRight") gehe(1); else if (e.key === "ArrowLeft") gehe(-1); };
    c.append(balken, buehne, nav);
    zeige();
  });
}

function zeigeBereich(liste, r) {
  liste.forEach((p, i) => {
    const k = el("button", "kachel"); if (i === 0 && liste.length > 1) k.classList.add("gross"); k.dataset.farbe = p.farbe || "gelb"; k.classList.add("neu"); beobachter(k);
    const kb = p.kachelbild || p.bild; if (kb) { k.classList.add("hatbild"); k.style.backgroundImage = "url('" + kb.replace(/'/g, "%27") + "')"; }
    if (p.weichbild) { k.classList.add("mitbild"); k.style.setProperty("--bg-img", "url('" + p.weichbild + "')"); }
    k.append(el("span", "kzahl", p.zahl || "→"), el("strong", "", p.titel), el("small", "", p.kurz || p.kategorie));
    k.onclick = () => projektStory(p);
    r.appendChild(k);
  });
}
BEREICHE.forEach(b => {
  const liste = PROJEKTE.filter(p => (p.bereich || "corporate") === b.id);
  if (!liste.length) return;
  const sec = el("section", "bereich");
  sec.append(el("h3", "bereichtitel", b.titel), el("p", "bereichtext", b.text));
  const r = el("div", "raster");
  sec.appendChild(r); $("projekte").appendChild(sec);
  zeigeBereich(liste, r);
});
</script>
