<!DOCTYPE html>
<html lang="de-CH">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gloria Antonio Dombaxe – Marketing & Social Media</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700&family=Figtree:wght@400;500;600&display=swap">
<style>
:root{--bg:#fbfbfa;--bg-alt:#f4f5f2;--card:#ffffff;--ink:#14213d;--muted:#5b6478;--line:#e2e4ea;--accent:#7c9a8b;--accent-ink:#ffffff;--accent-text:#4a6356;--stein:#14213d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#141516;--bg-alt:#1b1d1e;--card:#202223;--ink:#eef0ec;--muted:#9da3a0;--line:#313436;--accent:#83a897;--accent-ink:#141516;--accent-text:#a3c7b6;--stein:#e4dfd3}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:28px 18px 60px}
h1,h2,h3{font-family:'Bricolage Grotesque',system-ui,sans-serif;font-weight:700;line-height:1.08;margin:0}

/* Hero-Sektion mit warmem Farb-Anker (Punkt 1 & 3) */
.hero-sektion {
  background: var(--bg-alt);
  margin: -28px -18px 0 -18px;
  padding: 40px 18px 30px 18px;
  border-bottom: 1px solid var(--line);
  border-radius: 0 0 24px 24px;
}
.profil{display:flex;gap:32px;align-items:center;flex-wrap:wrap}
.avatar{width:130px;height:130px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--card),0 0 0 8px var(--stein);color:var(--accent-ink);display:grid;place-items:center;font:700 48px 'Bricolage Grotesque',system-ui,sans-serif;flex:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:260px}
.info h1{font-size:2.8rem}
.rolle{color:var(--muted);margin:4px 0 10px;font-weight:600}
.bio{margin:0 0 14px;max-width:52ch}
.zahlen{display:flex;gap:22px;margin:0 0 16px;padding:0;list-style:none}
.zahlen b{display:block;font:700 1.7rem 'Bricolage Grotesque',system-ui,sans-serif}
.zahlen span{font-size:.85rem;color:var(--muted)}
.btn{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:10px 20px;border-radius:999px;font-weight:600;text-decoration:none;border:0;cursor:pointer;font-size:1rem;transition:transform .2s ease, opacity .2s ease}
.btn:hover{transform:translateY(-2px);opacity:.95}
.btn:focus-visible,.tab:focus-visible,.kachel:focus-visible,.hl:focus-visible,.zu:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.highlights{display:flex;gap:18px;overflow-x:auto;padding:20px 0 10px;margin-top:20px}
.hl{background:none;border:0;cursor:pointer;text-align:center;color:var(--ink);font:500 .85rem Figtree,sans-serif;flex:none;width:72px}
.hl i{display:grid;place-items:center;width:64px;height:64px;margin:0 auto 6px;border-radius:50%;border:3px solid var(--accent);font-style:normal;font-size:1.5rem;background:var(--card);transition:transform .2s ease}
.hl:hover i{transform:scale(1.08)}

.raster{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-top:16px}
.kachel{aspect-ratio:1;border-radius:22px;border:0;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;color:#14213d;position:relative;overflow:hidden;background-size:cover;background-position:center;transition:transform .35s ease,box-shadow .25s ease}
.kachel:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 14px 30px rgba(0,0,0,.2)}
.kachel:active{transform:scale(.97)}
.kachel[data-farbe="kobalt"]{background-color:#3b5bff;color:#fff}.kachel[data-farbe="salbei"]{background-color:#8fd1a8}
.kachel[data-farbe="gelb"]{background-color:#ffd23f}.kachel[data-farbe="orange"]{background-color:#ff7a2f}
.kachel strong{font:700 1.5rem 'Bricolage Grotesque',system-ui,sans-serif;line-height:1.1}
.kachel small{opacity:.8;margin-top:4px}
.kachel.hatbild strong,.kachel.hatbild small{background:rgba(255,255,255,.88);color:#141516;padding:2px 8px;border-radius:6px;width:fit-content}
.suche{display:inline-block;border:1px solid var(--accent);color:var(--accent-text);border-radius:16px;padding:6px 14px;font-size:.9rem;margin:0 0 14px;background:var(--card)}
.knoepfe,.linkliste{display:flex;gap:10px;flex-wrap:wrap}
.linkliste{margin-top:20px}
.btn.zweit{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.zweit:hover{border-color:var(--accent-text);transform:translateY(-2px)}
.nr{font:500 .82rem Figtree,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:52px 0 14px}

/* Sektionen mit abwechselndem Hintergrund */
.kennzahlen-sektion { background: var(--bg-alt); margin: 0 -18px; padding: 24px 18px; border-radius: 20px; }
.tools-sektion { background: var(--bg-alt); margin: 0 -18px; padding: 24px 0; border-radius: 20px; }

.band{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 24px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:22px 16px;background:var(--card);border-radius:16px}
.zahl b{display:block;font:700 clamp(2.6rem,7vw,3.6rem)/1.05 'Bricolage Grotesque',system-ui,sans-serif;color:var(--accent-text)}
.zahl span{font-size:.9rem;color:var(--muted)}
.marquee{overflow:hidden;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0}
.track{display:flex;width:max-content;animation:lauf 36s linear infinite}
.marquee:hover .track{animation-play-state:paused}
.track span{font:500 1.7rem 'Bricolage Grotesque',system-ui,sans-serif;white-space:nowrap}
.track span::after{content:"·";margin:0 22px;color:var(--accent-text)}
@keyframes lauf{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.track{animation:none;flex-wrap:wrap;width:auto;row-gap:6px}.track span[aria-hidden]{display:none}}

.bereich{margin-top:34px}
.bereichtitel{font:700 2.1rem/1.1 'Bricolage Grotesque',system-ui,sans-serif;margin:0}
.bereichtext{color:var(--muted);margin:6px 0 0;max-width:60ch}

#story{width:min(430px,100%);height:min(100dvh,860px);max-height:none;padding:0;border:0;border-radius:20px;overflow:hidden;background:var(--card)}
#story::backdrop{background:rgba(0,0,0,.88)}
@media (max-width:480px){#story{width:100%;height:100dvh;border-radius:0}}
.st{position:relative;height:100%;display:flex;flex-direction:column;justify-content:center;padding:80px 28px 48px;color:#141516;overflow:auto}
.st h2{font:700 clamp(2.6rem,12vw,4rem)/1 'Bricolage Grotesque',system-ui,sans-serif;margin:0 0 18px}
.st p{font-size:1.2rem;line-height:1.45;max-width:32ch;margin:0}
.bars{position:absolute;top:16px;left:16px;right:16px;display:flex;gap:4px;z-index:2}
.bar{flex:1;height:3px;border-radius:2px;background:rgba(20,21,22,.25);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#141516}
.bar.fertig i{width:100%}
@media (prefers-reduced-motion:no-preference){.bar.aktiv i{animation:fuell 5s linear forwards}}
@media (prefers-reduced-motion:reduce){.bar.aktiv i{width:100%}}
@keyframes fuell{to{width:100%}}
.tap{position:absolute;top:0;bottom:0;width:42%;z-index:1;background:none;border:0;cursor:pointer}
.tap.l{left:0}.tap.r{right:0}
.stclose{position:absolute;top:30px;right:14px;z-index:3;width:44px;height:44px;border:0;border-radius:50%;background:rgba(20,21,22,.12);color:#141516;font-size:1.1rem;cursor:pointer}

.raster{grid-template-columns:repeat(4,1fr);grid-auto-rows:170px;grid-auto-flow:dense}
.kachel{aspect-ratio:auto}
.kachel.gross{grid-column:span 2;grid-row:span 2}
.kzahl{font:700 2.1rem/1 'Bricolage Grotesque',system-ui,sans-serif;margin-bottom:auto}
.kachel.gross .kzahl{font-size:3.6rem}
.kachel strong{font-size:1.15rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kachel.gross strong{font-size:1.8rem}
@media (max-width:620px){.raster{grid-template-columns:repeat(2,1fr);grid-auto-rows:150px}.kzahl{font-size:1.6rem}.kachel.gross .kzahl{font-size:2.8rem}}

h1,h2,h3,.kzahl,.fzahl,.zahl b,.bereichtitel{letter-spacing:-.02em}
dialog{width:min(640px,calc(100% - 24px));max-height:90vh;border:0;border-radius:18px;padding:0;background:var(--card);color:var(--ink);overflow:auto}
dialog::backdrop{background:rgba(10,18,28,.6)}
.inhalt{padding:26px 24px 30px}
.zu{float:right;background:var(--bg);color:var(--ink);border:0;border-radius:50%;width:36px;height:36px;cursor:pointer;font-size:1.1rem}
.kat{display:inline-block;color:var(--accent-text);font-weight:600;margin-bottom:6px}
.inhalt h2{font-size:2.3rem;margin-bottom:14px}
.inhalt h3{font:600 .95rem Figtree,sans-serif;margin:18px 0 4px;color:var(--accent-text)}
.inhalt p{margin:0;max-width:62ch}
.kontakt{margin-top:44px;padding:26px;background:var(--bg-alt);border:1px solid var(--line);border-radius:18px}
.kontakt p{margin:6px 0 14px}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>

<div class="wrap">

<div class="hero-sektion">

    <div class="avatar" id="avatar" aria-hidden="true"></div>

  <nav class="highlights" id="highlights" aria-label="Über mich"></nav>

<p class="nr">(02) Projekte</p>

</section>

</div>

const projMain=el('projekte');
function baueProjekte(){
  projMain.innerHTML='';

      <div class="raster">

            <div>

const dlg=el('dlg'), dlgInhalt=el('dlgInhalt');
function oeffneProjekt(sIdx, kIdx){
  const k=projektDaten[sIdx].kacheln[kIdx];
  dlgInhalt.innerHTML=`
    <button class="zu" onclick="dlg.close()">✕</button>
    <span class="kat">${projektDaten[sIdx].titel}</span>
    <h2>${k.kzahl}</h2>
    <p><b>${k.text}</b></p>
    <p style="margin-top:12px;">${k.small}</p>
  `;
  dlg.showModal();
}

let aktiveStory=0, timer=null;
const sDlg=el('story');
function oeffneStory(i){
  aktiveStory=i;
  sDlg.showModal();
  zeigeFolie();
}
function zeigeFolie(){
  clearTimeout(timer);
  const item=HIGHLIGHT_INHALTE[aktiveStory];
  sDlg.innerHTML=`
    <div class="st">
      <div class="bars">
        ${HIGHLIGHT_INHALTE.map((_,idx)=>`<div class="bar ${idx<aktiveStory?'fertig':idx===aktiveStory?'aktiv':''}"><i></i></div>`).join('')}
      </div>
      <button class="stclose" onclick="sDlg.close()">✕</button>
      <button class="tap l" onclick="schrittStory(-1)"></button>
      <button class="tap r" onclick="schrittStory(1)"></button>
      <h2>${item.symbol} ${item.titel}</h2>
      <p>${item.text}</p>
    </div>
  `;
  timer=setTimeout(()=>{
    if(aktiveStory<HIGHLIGHT_INHALTE.length-1){aktiveStory++; zeigeFolie();}else{sDlg.close();}
  },5000);
}
function schrittStory(richtung){
  clearTimeout(timer);
  aktiveStory+=richtung;
  if(aktiveStory<0)aktiveStory=0;
  if(aktiveStory>=HIGHLIGHT_INHALTE.length){sDlg.close();return;}
  zeigeFolie();
}

const obs=new IntersectionObserver(( entries)=>{
  entries.forEach(e=>{
    if(e.isIntersecting){
      const b=e.target.querySelector('[data-wert]');
      if(b && !b.classList.contains('laeuft')){
        b.classList.add('laeuft');
        oeffneZahl(b);
      }
    }
  });
},{threshold:0.5});
document.querySelectorAll('.zahl').forEach(z=>obs.observe(z));

function oeffneZahl(el){
  const txt=el.getAttribute('data-wert');
  const num=parseFloat(txt.replace(/[^0-9.]/g,''));
  if(isNaN(num))return;
  const prefix=txt.match(/^[^0-9]*/) || '';
  const suffix=txt.match(/[^0-9]*$/) || '';
  let start=0, step=num/30, dur=1000, interval=dur/30;
  let t=setInterval(()=>{
    start+=step;
    if(start>=num){start=num; clearInterval(t);}
    el.textContent=`${prefix}${Math.round(start)}${suffix}`;
  },interval);
}
